<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123a32">
  <title>{% block title %}{{ tr('app.name') }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version }}">
  <link rel="stylesheet" href="/static/alpha8.css?v={{ asset_version }}">
  <script>
    window.ZIPP_I18N={{ i18n_json|safe }};
    window.ZIPP_LANG={{ lang|tojson }};
    window.ZIPP_VERSION={{ version|tojson }};
  </script>
  <script src="/static/app.js?v={{ asset_version }}" defer></script>
</head>
<body data-project-id="{{ project.id if project is defined else '' }}" data-app-version="{{ version }}">
  <header class="topbar">
    <a class="brand" href="/">ZIPP <span>Diagnostika</span></a>
    <div class="topbar-actions">
      <div class="language-switch" aria-label="Language">
        <button type="button" data-language="cs" class="{{ 'active' if lang == 'cs' }}">CZ</button>
        <button type="button" data-language="sk" class="{{ 'active' if lang == 'sk' }}">SK</button>
      </div>
      <button type="button" class="technician-pill" data-change-technician>{{ tr('tech.current') }}: <strong data-technician-name>—</strong></button>
      <span class="connection" data-connection><i></i><span>{{ tr('connection.local') }}</span></span>
      <form action="/logout" method="post"><button type="submit" class="logout-button" title="{{ tr('logout') }}">↪ <span>{{ tr('logout') }}</span></button></form>
    </div>
  </header>
  <main class="shell">
    {% block content %}{% endblock %}
    <footer class="footer">{{ tr('app.name') }} · {{ version }}</footer>
  </main>
  <div class="toast" data-toast role="status" aria-live="polite"></div>
  <dialog data-technician-dialog>
    <form method="dialog" class="dialog-form" data-technician-form>
      <div><p class="eyebrow">{{ tr('tech.audit') }}</p><h2>{{ tr('tech.who') }}</h2><p class="muted">{{ tr('tech.explain') }}</p></div>
      <label>{{ tr('tech.name') }}<input name="technician" maxlength="100" autocomplete="name" required></label>
      <button type="submit" class="button primary" value="save">{{ tr('tech.continue') }}</button>
    </form>
  </dialog>
  {% block scripts %}{% endblock %}
</body>
</html>
