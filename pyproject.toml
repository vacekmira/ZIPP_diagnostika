[project]
name = "zipp-diagnostics"
version = "0.9.0a9"
description = "Terénní evidence diagnostiky ZIPP vazníků"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.52,<1",
  "websockets>=13,<16",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.9,<1",
  "argon2-cffi>=23.1,<26",
  "itsdangerous>=2.2,<3",
  "reportlab>=4.2,<5",
  "svglib>=1.5,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "pypdf>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["stability: dlouhý víceklientový WebSocket test"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*", "assets/fonts/*"]
